server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend per request via Docker's embedded DNS instead of once at startup -
    # otherwise nginx keeps a stale IP when the backend container is recreated (e.g. by an image
    # update) and may end up proxying to whichever container got that IP next.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://__BACKEND_HOST__:3000;

    # Proxy API calls to the backend service. __BACKEND_HOST__ is substituted at container start by
    # docker-entrypoint.d/10-backend-host-config.sh (default: fit-backend).
    location /api {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
