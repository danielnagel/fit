services:
  fit-db:
    image: postgres:16-alpine
    container_name: fit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # fuer den lokalen Dev-Modus (npm run dev), in dem Backend/Frontend ausserhalb von Docker laufen;
      # nur an localhost gebunden, Docker umgeht sonst die Host-Firewall.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  fit-backend:
    # Dev-Target mit tsx/Hot-Reload; das Default-Target des Dockerfiles ist das Prod-Image.
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: fit-backend
    restart: unless-stopped
    depends_on:
      fit-db:
        condition: service_healthy
    environment:
      PGHOST: fit-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/db:/app/backend/db
    networks:
      - internal

  fit-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fit-frontend
    restart: unless-stopped
    depends_on:
      - fit-backend
    ports:
      - "8080:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
